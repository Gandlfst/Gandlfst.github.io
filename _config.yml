title: SEED Emulators
description: >-
  Explore Internet, satellite network, and blockchain emulators for hands-on
  research and education.
url: "https://gandlfst.github.io"
baseurl: ""
lang: en

markdown: kramdown
highlighter: rouge
strict_front_matter: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .bundle
  - .github
  - .gitignore
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - vendor
  - video/README.md
