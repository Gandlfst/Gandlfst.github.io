<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝教授生日快乐</title>
    <style>
        :root {
            --bg: #060b1a;
            --gold: #f0c060;
            --rose: #e8a0b0;
            --warm: #f5e6d3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(1px 1px at 10% 15%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1px 1px at 25% 35%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 40% 20%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(1px 1px at 55% 45%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 70% 30%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 85% 50%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1px 1px at 15% 60%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 30% 70%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 50% 65%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 65% 75%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 80% 60%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1px 1px at 20% 80%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1px 1px at 45% 85%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 75% 20%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(255, 255, 255, 0.3), transparent);
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        canvas#fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .golden-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240, 192, 96, 0.12) 0%, rgba(240, 192, 96, 0.03) 50%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.7;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .greeting {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #fcd34d 0%, #f9a8d4 35%, #c084fc 70%, #fcd34d 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s ease-in-out infinite;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.4));
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #e2d5c8;
            font-weight: 400;
            letter-spacing: 0.12em;
            opacity: 0;
            animation: fadeInUp 1.8s ease forwards 0.6s;
            margin-bottom: 48px;
        }

        .back-home {
            display: inline-block;
            padding: 14px 38px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(240, 192, 96, 0.35);
            color: #f5e6d3;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeInUp 1.8s ease forwards 1.2s;
            pointer-events: all;
            cursor: pointer;
        }

        .back-home:hover {
            background: rgba(240, 192, 96, 0.15);
            border-color: rgba(240, 192, 96, 0.7);
            box-shadow: 0 0 40px rgba(240, 192, 96, 0.25), 0 8px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-glow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(240, 192, 96, 0.08), transparent);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stars-layer"></div>
    <canvas id="fireworks"></canvas>
    <div class="golden-glow"></div>
    <div class="footer-glow"></div>

    <div class="content">
        <h1 class="greeting">祝教授生日快乐</h1>
        <p class="subtitle">感谢您的悉心教导与无私支持</p>
        <a href="index.html" class="back-home">← 返回 SEED 仿真系统首页</a>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let fireworks = [];
            const gravity = 0.025;
            const friction = 0.985;

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function random(min, max) {
                return Math.random() * (max - min) + min;
            }

            class Particle {
                constructor(x, y, color, speed, angle) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.speed = speed;
                    this.angle = angle;
                    this.alpha = 1;
                    this.decay = random(0.012, 0.028);
                    this.size = random(1.8, 3.5);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - random(1.5, 4);
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.globalAlpha = this.alpha * 0.4;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
                update() {
                    this.vy += gravity;
                    this.vx *= friction;
                    this.vy *= friction;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                }
            }

            class Firework {
                constructor() {
                    this.x = random(width * 0.15, width * 0.85);
                    this.y = height;
                    this.targetY = random(height * 0.12, height * 0.42);
                    this.speed = random(4.5, 8.5);
                    this.hue = random(0, 360);
                    this.color = `hsl(${this.hue}, 85%, 62%)`;
                    this.trail = [];
                    this.exploded = false;
                }
                update() {
                    if (!this.exploded) {
                        this.trail.push({ x: this.x, y: this.y });
                        if (this.trail.length > 10) this.trail.shift();
                        this.y -= this.speed;
                        if (this.y <= this.targetY) {
                            this.explode();
                            this.exploded = true;
                        }
                    }
                }
                draw(ctx) {
                    if (!this.exploded) {
                        ctx.save();
                        for (let i = 0; i < this.trail.length; i++) {
                            const t = this.trail[i];
                            ctx.globalAlpha = i / this.trail.length * 0.55;
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                            ctx.fillStyle = '#fffbe6';
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 2.8, 0, Math.PI * 2);
                        ctx.fillStyle = '#fffef5';
                        ctx.fill();
                        ctx.restore();
                    }
                }
                explode() {
                    const count = Math.floor(random(70, 130));
                    const burstColor = `hsl(${this.hue}, 85%, 62%)`;
                    for (let i = 0; i < count; i++) {
                        const angle = random(0, Math.PI * 2);
                        const speed = random(2, 9);
                        particles.push(new Particle(this.x, this.y, burstColor, speed, angle));
                    }
                    const goldCount = Math.floor(count * 0.25);
                    for (let i = 0; i < goldCount; i++) {
                        const angle = random(0, Math.PI * 2);
                        const speed = random(1, 3.5);
                        particles.push(new Particle(this.x, this.y, '#fde68a', speed, angle));
                    }
                }
            }

            function spawnFirework() {
                fireworks.push(new Firework());
                const nextDelay = random(600, 1800);
                setTimeout(spawnFirework, nextDelay);
            }

            for (let i = 0; i < 4; i++) {
                setTimeout(() => fireworks.push(new Firework()), i * 250);
            }
            setTimeout(spawnFirework, 2200);

            function animate() {
                ctx.fillStyle = 'rgba(6, 11, 26, 0.13)';
                ctx.fillRect(0, 0, width, height);

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    fw.update();
                    fw.draw(ctx);
                    if (fw.exploded) fireworks.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw(ctx);
                    if (p.alpha <= 0.015) particles.splice(i, 1);
                }

                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
