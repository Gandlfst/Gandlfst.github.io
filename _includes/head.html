{% comment %}页面元信息：标题、描述、规范地址和分享卡片。{% endcomment %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{{ site.data.themes.first.colors.bg }}">
{% include theme-init.html %}
<title>{% unless page.home %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/images/seed-mark.svg' | relative_url }}" type="image/svg+xml">

{% comment %}样式按职责加载：基础规则 → 页面布局 → 配色覆盖。{% endcomment %}
<link rel="stylesheet" href="{{ '/css/base.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/css/themes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
