<section class="portal-projects" aria-labelledby="projects-title">
  <div class="portal-section-heading"><h2 id="projects-title">Our projects</h2><span>Explore an emulator</span></div>
  <div class="portal-project-grid">
    {% for project in site.data.home.projects %}
      {% include emulators/project.html
        title=project.title
        url=project.url
        image=project.image
        image_alt=project.image_alt
        category=project.category
        description=project.description
      %}
    {% endfor %}
  </div>
</section>
