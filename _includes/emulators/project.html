<article class="portal-project">
  <a class="portal-project-image{% unless include.image %} portal-project-placeholder{% endunless %}" href="{{ include.url | relative_url }}" aria-label="Explore {{ include.title | escape }}">
    {% if include.image %}<img src="{{ include.image | relative_url }}" alt="{{ include.image_alt | escape }}" width="480" height="300">{% else %}{% include components/icon.html name="globe" %}<span>Satellite Network Emulator</span><small>Project preview coming soon</small>{% endif %}
  </a>
  <p class="portal-project-category">{{ include.category }}</p>
  <h3><a href="{{ include.url | relative_url }}">{{ include.title }}</a></h3>
  <p class="portal-project-description">{{ include.description }}</p>
  <a class="portal-project-more" href="{{ include.url | relative_url }}">Explore project {% include components/icon.html name="arrow" %}</a>
</article>
