<header class="site-header portal-header">
  <div class="container header-inner">
    <a class="portal-brand" href="{{ '/' | relative_url }}" aria-label="SEED Emulators home"><img src="{{ '/images/seed-labs-logo.png' | relative_url }}" alt="SEED Labs" width="150" height="46"><span>Emulators</span></a>
    <span class="portal-header-note">A playground for research &amp; discovery</span>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-navigation" aria-label="Open navigation">{% include components/icon.html name="menu" %}</button>
    <div class="portal-navigation-bar">
    <nav class="main-navigation" id="main-navigation" aria-label="Main navigation">
      {% for link in site.data.portal_navigation %}
      <a href="{{ link.url | relative_url }}"{% if link.key == 'home' and page.home %} aria-current="page"{% elsif link.key and link.key == page.project %} aria-current="page"{% endif %}>{{ link.title }}{% if link.external %} {% include components/icon.html name="external" %}{% endif %}</a>
      {% endfor %}
    </nav>
    {% include emulators/theme-picker.html %}
    </div>
  </div>
</header>
