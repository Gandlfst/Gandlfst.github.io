{% comment %}Local video player with optional WebM, poster, caption, and playback error feedback.{% endcomment %}
<figure class="video-panel">
  <div class="panel-bar"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>{{ include.label }}</span><span class="panel-badge">DEMO</span></div>
  {% comment %}Native browser player: prefer WebM with MP4 as the fallback.{% endcomment %}
  <video controls muted playsinline preload="none"{% if include.poster %} poster="{{ include.poster | relative_url }}"{% endif %} aria-label="{{ include.label | escape }}">
    {% if include.webm %}<source src="{{ include.webm | relative_url }}" type="video/webm">{% endif %}
    <source src="{{ include.src | relative_url }}" type="video/mp4">
    Your browser does not support embedded video. <a href="{{ include.src | relative_url }}">Download the demo</a>.
  </video>
  {% comment %}Provide a direct file link if embedded playback fails.{% endcomment %}
  <p class="video-error" hidden role="status">Playback is unavailable in this browser. <a href="{{ include.src | relative_url }}">Open the video</a>.</p>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
