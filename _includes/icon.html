{% comment %}共享 SVG 图标：调用时通过 name 指定图标名称。{% endcomment %}
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% case include.name %}
{% when 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% when 'external' %}<path d="M7 17 17 7M7 7h10v10"/>
{% when 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% when 'play' %}<path d="m9 5 11 7-11 7z"/>
{% when 'globe' %}<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
{% else %}<rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/>
{% endcase %}
</svg>
