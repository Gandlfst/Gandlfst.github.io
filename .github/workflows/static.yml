name: Build and deploy Jekyll to Pages

on:
  # Publish after merging to main; pull requests targeting main only run build checks.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every trigger validates the build and local links without deployment permissions.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Check pages, links and assets
        run: node scripts/check-site.cjs

      - name: Upload the built site
        if: github.repository == 'seed-labs/seedemu-website' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Only main in the official repository may deploy; other manual runs only validate.
  deploy:
    if: github.repository == 'seed-labs/seedemu-website' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the built site
        id: deployment
        uses: actions/deploy-pages@v4
